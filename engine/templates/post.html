<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet" />
{{HEAD}}
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{W}}px; height: {{H}}px; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; background: var(--bg); overflow: hidden; }
  :root { --primary: {{PRIMARY}}; --secondary: {{SECONDARY}}; --accent: {{ACCENT}}; --bg: {{BG}}; --logo-h: {{LOGOH}}px; }
  /* Brand logo — size comes from Brand Brain → Logo size. Use <img class="logo" src="{{LOGO}}">. */
  .logo { display: block; height: var(--logo-h); width: auto; max-width: 48%; object-fit: contain; }
  .display { font-family: Unbounded, system-ui, sans-serif; letter-spacing: -0.01em; }
  .frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .rings { position: absolute; pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: 26px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); }
  .pill { display: inline-block; padding: 22px 38px; border-radius: 999px; font-weight: 800; font-size: 30px; }
</style>
</head>
<body>{{BODY}}</body>
</html>
